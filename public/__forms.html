<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
  </head>
  <body>
    <form
      name="lonburg-request"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="lonburg-request" />
      <input type="hidden" name="subject" value="Новая заявка с сайта Лонбург" />
      <input name="bot-field" />
      <input name="vehicleType" />
      <input name="model" />
      <input name="condition" />
      <input name="year" />
      <input name="power" />
      <input name="engineVolume" />
      <input name="city" />
      <input name="name" />
      <input name="contact" />
      <input name="registration" />
      <textarea name="comment"></textarea>
    </form>
  </body>
</html>
